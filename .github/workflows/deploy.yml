name: deploy

# Deploy to Cloudflare Workers on push to main.
#
# Required repository config:
#   secrets.CLOUDFLARE_API_TOKEN  — token with "Edit Cloudflare Workers"
#   vars.CLOUDFLARE_ACCOUNT_ID    — target account id
#
# Worker secrets (R2_*, SYSTEM_ADMIN_USER_IDS, STORAGE_ORIGIN) are managed
# out-of-band with `wrangler secret put`, not here.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2

      # Bundle the worker (dist/worker.js) + static assets (dist/public).
      - run: deno task build:cf

      # deno tasks run under `nodeModulesDir: auto`; a later npm install (used
      # by wrangler-action) crashes on that layout. dist/ is self-contained, so
      # wipe node_modules for a clean npm context before deploy.
      - run: rm -rf node_modules

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
